<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting Recognition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h1>Handwriting<br /><span>Recognition</span></h1>
        <br>
        <canvas id="canvas" class="border"></canvas>
        <br>
        <br>
        <button class="btn btn-primary btn-spacing" onclick="recognize()">Recognize</button>
        <button class="btn btn-danger" onclick="clearCanvas()">Clear</button>
        <h3 class="mt-3"><strong>Recognized Text:</strong> <span id="result">...</span></h3>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 600;
        canvas.height = 450;
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let painting = false;
        let lastX = 0, lastY = 0;

        function startPosition(event) {
            painting = true;
            [lastX, lastY] = [event.offsetX, event.offsetY];
        }
        function stopPosition() {
            painting = false;
            ctx.beginPath();
        }
        function draw(event) {
            if (!painting) return;
            ctx.lineWidth = 10;
            ctx.lineCap = "round";
            ctx.strokeStyle = "black";

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(event.offsetX, event.offsetY);
            ctx.stroke();

            [lastX, lastY] = [event.offsetX, event.offsetY];
        }

        canvas.addEventListener("mousedown", startPosition);
        canvas.addEventListener("mouseup", stopPosition);
        canvas.addEventListener("mouseleave", stopPosition);
        canvas.addEventListener("mousemove", draw);

        function clearCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById("result").innerText = "...";
        }

        async function recognize() {
            document.getElementById("result").innerText = "Processing...";

            try {
                const imageData = canvas.toDataURL("image/png");  
                const base64String = imageData.split(",")[1];  

                let response = await fetch("http://127.0.0.1:5000/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: base64String })
                });

                if (!response.ok) throw new Error("Failed to get prediction.");

                let data = await response.json();
                document.getElementById("result").innerText = data.prediction;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("result").innerText = "Error!";
            }
        }
    </script>
</body>
</html>
